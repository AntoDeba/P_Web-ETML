<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Coffever</title>
    <meta name="author" content="Antoni Débaz">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link href="img/icon.png" rel="icon" type="image/png">
</head>
<body>
    <header>
        <nav>
            <a href="index.html"><img src="img/home-alt-2.png" alt="Accueil">Accueil</a>
            <a href="inspiration.html"><img src="img/light-bulb-alt.png" alt="Inspiration">Inspiration</a>
            <a href="contact.html"><img src="img/phone.png" alt="Contact">Contact</a>
        </nav>
        <a href="index.html"><img src="img/logo.png" class="logo" alt="Logo"></a> 
    </header>
    <main>
        <section class="Title">
            <h1>Contact</h1>
        </section>
        <section>
            <p class="centeredText">
                Nous vous remercions d’avoir consulté notre site. Contactez nous en cas de questions ou projet et nous aurons le plaisir de ne pas vous repondre.
            </p>
            <form>
                <div class="ContactHolder">
                    <div>
                        <label for="Nom">Nom</label>
                        <input type="text" required id="Nom" placeholder="Smith">

                        <label for="Prenom" >Prénom</label>
                        <input type="text"  id="Prenom" placeholder="John">

                        <label for="Telephone">Numéro de téléphone</label>
                        <input type="text" id="Telephone" placeholder="+41 77 528 72 43">

                        <label for="mail">Adresse email</label>
                        <input type="text" required id="mail" placeholder="antoni.debaz@gmail.com">
                    </div>
                    
                    <div>
                        <label for="Titre">Titre</label>
                        <input type="text" required id="Titre" placeholder="Your title">

                        <label for="zoneText">Message</label>
                        <textarea required id="zoneText" placeholder="Votre message .."></textarea>
                    </div>
                </div>
                <div class="ContactBottom">
                    <button type="submit">Envoyer</button>
                </div>
            </form>
        </section>

    </main>
    <footer>
            <a href="index.html">Accueil</a>
            <a href="auteur.html">Auteur</a>
            <a href="contact.html">Contact</a>
            <a href="CoffeverGame/index.html">Jeu</a>
            <a href="rapport.html">Rapport</a>
            <p>&copy; 2026 Coffever</p>
    </footer>
</body>
</html>
