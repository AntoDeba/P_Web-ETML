<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Coffever</title>
    <meta name="author" content="Antoni Débaz">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link href="img/icon.png" rel="icon" type="image/png">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="inspiration.html">Inspiration</a>
            <a href="contact.html">Contact</a>
        </nav>
        <a href="index.html"><img src="img/logo.png" class="logo"></a> 
    </header>
    <main>
        <section class="Title">
            <h1>Contact</h1>
        </section>
        <section>
            <form>
                <div class="ContactHolder">
                    <div>
                        <label for="Nom">Nom</label>
                        <input type="text" required id="Nom">

                        <label for="Prenom">Prénom</label>
                        <input type="text" id="Prenom">

                        <label for="Telephone">Numéro de téléphone</label>
                        <input type="text" id="Telephone">

                        <label for="mail">Adresse email</label>
                        <input type="text" required id="mail">
                    </div>
                    
                    <div>
                        <label for="Titre">Titre</label>
                        <input type="text" required id="Titre">

                        <label for="zoneText">Message</label>
                        <textarea name="" required id="zoneText"></textarea>
                    </div>
                </div>
                <div class="ContactBottom">
                    <button type="submit">Envoyer</button>
                </div>
            </form>
        </section>

    </main>
    <footer>
            <a href="index.html">Accueil</a>
            <a href="Auteur.html">Auteur</a>
            <a href="contact.html">Contact</a>
            <p>&copy; 2026 Coffever</p>
    </footer>
</body>
</html>
